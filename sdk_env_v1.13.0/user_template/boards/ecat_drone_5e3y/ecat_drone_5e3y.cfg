#
# OpenOCD board configuration for ecat_drone_5e3y
#   SoC    : HPM5E3Y (same debug infrastructure as HPM5E00 series)
#   Flash  : internal XPI NOR flash, XPI0, base 0x80000000, 1MB
#
# openocd flash driver argument:
#   - option0: see hpm_sdk/boards/openocd/boards/hpm5e00evk.cfg
#   - option1: [19:16] IO voltage (0 - 3V / 1 - 1.8V)
#
flash bank xpi0 hpm_xpi 0x80000000 0x100000 1 1 $_TARGET0 0xF3000000 0x5 0x1000

proc init_clock {} {
    mww 0xF4000800 0xFFFFFFFF
    mww 0xF4000810 0xFFFFFFFF
    mww 0xF4000820 0xFFFFFFFF
    mww 0xF4000830 0xFFFFFFFF
    echo "clocks has been enabled!"
}

$_TARGET0 configure -event reset-init {
    init_clock
}

$_TARGET0 configure -event gdb-attach {
    reset halt
}
